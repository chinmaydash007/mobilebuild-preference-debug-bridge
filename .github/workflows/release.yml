name: Signed Maven Central release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-central-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository_id == '1374022344' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: bash scripts/verify.sh

  devices:
    if: github.repository_id == '1374022344' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/device.yml
    with:
      source_ref: ${{ github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name) || github.ref }}

  publish:
    needs: [validate, devices]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify release repository and source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python3 - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, 'scripts')
          import release
          release.require_release_repository(os.environ['GITHUB_TOKEN'])
          if os.environ.get('RELEASE_TAG'):
              version = release.properties()['VERSION_NAME']
              commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              release.validate_tag(os.environ['RELEASE_TAG'], version, commit)
          PY
      - name: Restore exact assets on a release retry
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/release.py restore --tag "$RELEASE_TAG"
      - name: Sign and stage publication
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ ! -f build/release/publication-manifest.json ]; then
            python3 scripts/stage_signed.py
            gpg --batch --import signing-public.asc
            python3 scripts/bundle.py --signed
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-publication-evidence
          path: build/release/
          retention-days: 30
      - name: Publish and verify public Central downloads
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gpg --batch --import signing-public.asc
          python3 scripts/release.py publish --tag "$RELEASE_TAG"
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          ./gradlew --no-daemon --refresh-dependencies -p consumer-fixture \
            -PbridgeVersion="$version" \
            -g "$RUNNER_TEMP/central-consumer-gradle" \
            :app:assembleDebug :app:assembleRelease
