name: Device protocol smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adb-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build sample
        run: ./gradlew :sample:assembleDebug

      - name: Exercise plain and encrypted stores
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/device_smoke_test.py --adb "$ANDROID_HOME/platform-tools/adb"
