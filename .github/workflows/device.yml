name: Device protocol compatibility

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  adb-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build sample
        run: ./gradlew --no-daemon :sample:assembleDebug
      - name: Enable KVM acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Exercise plain and encrypted stores
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 scripts/device_smoke_test.py --adb "$ANDROID_HOME/platform-tools/adb"
