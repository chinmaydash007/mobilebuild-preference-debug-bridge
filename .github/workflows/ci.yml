name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test, lint, and publish locally
        run: |
          ./gradlew test lint \
            :preference-debug-bridge:assembleRelease \
            :sample:assembleDebug :sample:assembleRelease \
            publishToMavenLocal

      - name: Resolve the published artifact from a clean consumer
        run: |
          ./gradlew -p consumer-fixture \
            :app:assembleDebug :app:assembleRelease

      - name: Verify debug-only manifest isolation
        run: python3 scripts/verify_manifests.py
