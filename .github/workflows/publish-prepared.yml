name: Publish prepared Maven Central release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag with a signed GitHub release draft
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: maven-central-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository_id == '1374022344' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: bash scripts/verify.sh

  devices:
    if: github.repository_id == '1374022344' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/device.yml
    with:
      source_ref: refs/tags/${{ inputs.release_tag }}

  publish:
    needs: [validate, devices]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test publisher recovery logic
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Restore the exact signed release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py restore --tag "$RELEASE_TAG"
      - name: Publish GitHub draft and signed Central bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          gpg --batch --import signing-public.asc
          python3 scripts/release.py publish --tag "$RELEASE_TAG" --publish-draft
      - name: Build clean consumer from public Central
        run: |
          ./gradlew --no-daemon --refresh-dependencies -p consumer-fixture \
            -PbridgeVersion="${RELEASE_TAG#v}" \
            -g "$RUNNER_TEMP/central-consumer-gradle" \
            :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-publication-evidence
          path: build/release/
          retention-days: 30
